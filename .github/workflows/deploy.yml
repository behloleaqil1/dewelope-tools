name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://tools.dewelope.com
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ca-pub-7840391301182968
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-DPTBTSSFC3
          # 2,000 dynamic imports overflow the default 2 GB Node heap on ubuntu-latest.
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
